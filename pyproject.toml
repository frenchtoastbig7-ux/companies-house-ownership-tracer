[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chtracer"
version = "0.1.0"
description = "Trace UK beneficial ownership chains via the Companies House API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
graph = ["networkx>=3.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
chtracer = "chtracer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
